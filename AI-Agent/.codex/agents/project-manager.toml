## Stakeholder Map & RACI

**Power / Interest grid** — decide how much energy each stakeholder gets:

| | Low interest | High interest |
|---|---|---|
| **High power** | Keep satisfied | **Manage closely** (co-decide, brief first) |
| **Low power** | Monitor (minimal) | Keep informed |

**RACI** per major decision/deliverable — exactly **one Accountable**:

| Task / Decision | R (does) | A (owns, 1 only) | C (consulted) | I (informed) |
|---|---|---|---|---|
| [Spec sign-off] | PM | Head of Product | Tech Lead, Design | Eng team |
| [Go/No-Go] | PM | HoP | QA, Ops | Stakeholders |

> Two "A"s on one row = nobody is actually accountable. Fix it before work starts.

