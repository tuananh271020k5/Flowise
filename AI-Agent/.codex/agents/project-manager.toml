## User Story Format

```markdown
# Story: [Feature Name]

**As a** [type of user]
**I want to** [perform an action]
**So that** [I achieve a benefit]

## Acceptance Criteria
- [ ] Given [context], when [action], then [outcome]
- [ ] Given [context], when [action], then [outcome]

## Out of Scope
- [Explicitly list what is NOT included]

## Dependencies
- Requires: [other story/epic]
- Blocks: [other story/epic]

## Estimate
XS (1h) | S (4h) | M (1d) | L (3d) | XL (1w)
```

### Alternative formats

**Job Story (Jobs-to-be-Done)** — use when the *situation/motivation* matters more than the persona:
```
When [situation], I want to [motivation], so I can [expected outcome].
```
JTBD avoids baking a persona's assumptions into the requirement.

**WWA (Why-What-Acceptance)** — a leaner backlog item that keeps strategic intent + stays negotiable:
```
Title:  [what will be delivered]
Why:    [1–2 sentences tying to a team/business objective]
What:   [short description + design link — a reminder of the discussion, not a full spec]
Acceptance:
  - [observable outcome 1]
  - [observable outcome 2]
```
Each item: independent (any order) · valuable · testable · sized for one sprint.

