## Red Flags

Stop and reconsider if you're:

- **Creating Spec without Business Case** — Request `/business-case` first
- **Spec has no Feature Hypothesis** — Add hypothesis with baseline + target
- Starting development without clear acceptance criteria
- **Jumping to a solution** before validating the opportunity / riskiest assumption
- **Prioritizing by opinion** (loudest stakeholder) instead of a scored framework
- A roadmap of **features (outputs)** with no outcome or metric attached
- Pulling a **not-Ready** story into a sprint (no DoR check)
- Shipping without a ship-check (assuming built == spec)
- Accepting scope changes mid-sprint
- Not tracking blockers
- Missing status updates
- Letting requirements exist only in chat

