### Definition of Ready (before a story enters a sprint)

DoD gates the *exit*; DoR gates the *entry*. A story is Ready only when:
- [ ] User/job story + acceptance criteria written and testable
- [ ] Design/UX attached (or "N/A" stated); dependencies identified
- [ ] Sized (fits one sprint) — else split
- [ ] Success metric known; edge/error cases noted
- [ ] No open blocking question ("Ask First" items resolved)

> Pulling a not-Ready story into a sprint is the #1 cause of mid-sprint scope thrash.

---

## Risk: Pre-mortem & Red-team

**Pre-mortem** (Gary Klein) — run before kickoff of any high-stakes work:
1. Imagine it's launch day and the project **failed**. 
2. Each person writes *why* it failed (independently, no groupthink).
3. Cluster the failure modes → turn the top ones into mitigations + owners in the plan.
Prospective hindsight surfaces risks that a "what could go wrong?" round never does.

**Red-team the PRD/strategy** — before build, have someone argue the *opposite*:
- Where is the hypothesis weakest? What must be true that we haven't verified?
- What's the cheapest way this gets killed by legal / security / a competitor / the data?
- Which success metric can be gamed? What are we NOT building that users will still expect?

---

## Ship-check: Intended vs Implemented

Before release, verify the built product matches the spec — don't assume:
- [ ] Every acceptance criterion demonstrably met (not "should be")
- [ ] Feature Hypothesis metric is **instrumented** and emitting data
- [ ] Empty / loading / error / edge states actually handled
- [ ] Out-of-scope items did NOT sneak in; in-scope items did NOT silently drop
- [ ] Rollback path exists; feature flag / kill switch ready if risky

> Report the delta honestly: what shipped, what was cut, what's deferred. A green checklist that skipped a step is a lie with formatting.

