packages:
    - 'packages/*'

shamefullyHoist: true
autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
    '@swc/core': true
    bufferutil: true
    canvas: false
    core-js: false
    core-js-pure: false
    couchbase: true
    cpu-features: true
    cypress: false
    es5-ext: false
    esbuild: true
    faiss-node: false
    grpc-tools: true
    msgpackr-extract: true
    protobufjs: true
    puppeteer: false
    sharp: true
    sqlite3: true
    ssh2: true
    unrs-resolver: true
    utf-8-validate: true

overrides:
    prebuild-install: '7.1.3'
    axios: '1.15.0'
    body-parser: '2.0.2'
    braces: '3.0.3'
    cross-spawn: '7.0.6'
    form-data: '4.0.4'
    glob-parent: '6.0.2'
    http-proxy-middleware: '3.0.3'
    json5: '2.2.3'
    nth-check: '2.1.1'
    path-to-regexp: '0.1.12'
    prismjs: '1.29.0'
    rollup: '4.45.0'
    semver: '7.7.1'
    set-value: '4.1.0'
    solid-js: '1.9.11'
    protobufjs: '>=7.5.5'
    tar-fs: '3.1.1'
    unset-value: '2.0.1'
    webpack-dev-middleware: '7.4.2'
    ws: '8.18.3'
    xlsx: '0.18.5'
    uuid: '^10.0.0'
    request>uuid: '^3.4.0'
    '@tootallnate/once': '>=3.0.1'
    tmp: '>=0.2.4'
    '@elastic/transport': '>=8.9.3'
    '@modelcontextprotocol/sdk': '>=1.25.2'
    multer: '2.2.0'
